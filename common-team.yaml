  # ============================================================================
  - kind: delegates_to
    from: team_lead.team_lead
    to: product_owner.product_owner
  - kind: delegates_to
    from: team_lead.team_lead
    to: developer_owner.developer_owner
  - kind: delegates_to
    from: team_lead.team_lead
    to: qa_engineer.qa_engineer
  - kind: delegates_to
    from: team_lead.team_lead
    to: review_independent.review_independent
  - kind: delegates_to
    from: team_lead.team_lead
    to: security_analyst.security_analyst
  - kind: delegates_to
    from: team_lead.team_lead
    to: devops_engineer.devops_engineer
  - kind: delegates_to
    from: team_lead.team_lead
    to: tech_writer.tech_writer
  - kind: delegates_to
    from: team_lead.team_lead
    to: developer_implementer.developer_implementer
  - kind: delegates_to
    from: team_lead.team_lead
    to: developer_backend.developer_backend
  - kind: delegates_to
    from: team_lead.team_lead
    to: developer_frontend.developer_frontend
  - kind: collaborates_with
    from: team_lead.team_lead
    to: product_owner.product_owner
  - kind: collaborates_with
    from: team_lead.team_lead
    to: developer_owner.developer_owner

  # ============================================================================
