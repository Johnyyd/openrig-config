    to: developer_owner.developer_owner
  - kind: escalates_to
    from: developer_frontend.developer_frontend
    to: developer_owner.developer_owner
  - kind: escalates_to
    from: developer_implementer.developer_implementer
    to: developer_owner.developer_owner
  - kind: collaborates_with
    from: developer_backend.developer_backend
    to: developer_frontend.developer_frontend
  - kind: collaborates_with
    from: developer_implementer.developer_implementer
    to: developer_backend.developer_backend
