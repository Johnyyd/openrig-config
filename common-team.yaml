    from: product_owner.product_owner
    to: team_lead.team_lead
  - kind: escalates_to
    from: developer_owner.developer_owner
    to: team_lead.team_lead
  - kind: escalates_to
    from: qa_engineer.qa_engineer
    to: team_lead.team_lead
  - kind: escalates_to
    from: review_independent.review_independent
    to: team_lead.team_lead
  - kind: escalates_to
    from: security_analyst.security_analyst
    to: team_lead.team_lead
  - kind: escalates_to
    from: devops_engineer.devops_engineer
    to: team_lead.team_lead
  - kind: escalates_to
    from: tech_writer.tech_writer
    to: team_lead.team_lead
  - kind: escalates_to
    from: developer_implementer.developer_implementer
    to: team_lead.team_lead
  - kind: escalates_to
    from: developer_backend.developer_backend
    to: team_lead.team_lead
  - kind: escalates_to
    from: developer_frontend.developer_frontend
    to: team_lead.team_lead

