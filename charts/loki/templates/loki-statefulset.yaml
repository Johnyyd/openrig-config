{{- if .Values.loki.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "loki-stack.fullname" . }}-loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "loki-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  serviceName: {{ include "loki-stack.fullname" . }}-loki
  replicas: {{ .Values.loki.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "loki-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "loki-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loki
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "loki-stack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.loki.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "loki-stack.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: loki
      {{- end }}
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          securityContext:
            {{- toYaml .Values.loki.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.loki.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.loki.livenessProbe | nindent 12 }}
          volumeMounts:
            - name: loki-data
              mountPath: /loki
            - name: config
              mountPath: /etc/loki
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      volumes:
        - name: config
          configMap:
            name: {{ include "loki-stack.fullname" . }}-loki-config
  {{- if .Values.loki.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: loki-data
      spec:
        accessModes:
          {{- toYaml .Values.loki.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.loki.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.loki.persistence.size }}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: loki-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  {{- end }}
{{- end }}