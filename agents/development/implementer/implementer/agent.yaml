name: implementer
version: "1.0"
description: "Implementation agent — writes code following TDD discipline"

defaults:
  runtime: claude-code

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true