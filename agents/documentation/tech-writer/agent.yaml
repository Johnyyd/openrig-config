name: tech_writer
version: "1.0"
description: "Technical Writer agent for documentation"

defaults:
  runtime: claude-code

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources:
        [
          shared:claude-default-settings,
          shared:claude-default-mcp,
          shared:claude-code-default-config,
          shared:claude-activity-hooks,
        ]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
